name: Daily Price Check

on:
  schedule:
    - cron: "0 12 * * *"  # 9 AM Argentina (UTC-3)
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-price-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r telegram-price-bot/requirements.txt

